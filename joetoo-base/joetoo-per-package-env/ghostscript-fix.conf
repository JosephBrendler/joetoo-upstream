#
# ghostscript-fix.conf - force a finicky/old C program to compile in a newer/stricter compiler
#
# -Wno-error=maybe-uninitialized: Prevent compiler from crashing if it thinks var might be used before assigned
# -Wno-error=declaration-after-statement: downgrade to warning for failure to declare var at top of function or
#   if blending declaration and assignment
# -Wno-error: tells compiler to ignore findings and treat them as warnings only; do not stop compilation
#
CFLAGS="${CFLAGS} -Wno-error=maybe-uninitialized -Wno-error=declaration-after-statement -Wno-error=return-type -Wno-error"
#
# uncomment below to serialize if needed - ghostscript complex build targets occasionally
#   suffer race conditions for parallel make jobs (e.g. -j8, -j16)
#MAKEOPTS="-j1"
# Note: Use j1_makeopts.conf to express this policy, if needed, so it can remain
# controlled by choice/use of appropriate ONE-policy.conf file names in package.env
#
# uncomment to reject binpkgs and disable distcc - ghostscript has some negative distcc history
# (can get confused when source files are shipped out to other machines on a network to be compiled,
#  so keeping it strictly local prevents weird linking issues). 
#FEATURES="-getbinpkg -distcc" 
# uncomment to disable distcc 
#FEATURES="${FEATURES} -distcc" 
# Note: Use nodist_features.conf to express this policy, if needed, so it can remain
# controlled by choice/use of appropriate ONE-policy.conf file names in package.env
