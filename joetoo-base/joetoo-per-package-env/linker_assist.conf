#
# /etc/portage/env/linker-assist.conf - helps resolve transitive dependencies in cross-builds
# (i.e. resolve dependencies of dependencies. forces the linker to look inside the DT_NEEDED headers of
#  depencencies [Package B], copy its dependencies, and explicitly link those [Package C] into the final
#  binary [for Package A]
#
LDFLAGS="${LDFLAGS} -Wl,--copy-dt-needed-entries"
