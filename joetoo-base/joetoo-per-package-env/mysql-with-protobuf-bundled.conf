#
# mysql-with-protobuf-bundled.conf - force MySQL's build engine to bypass global system
# library and compile its own internal, bundled copy of Google Protocol Buffers instead,
# preventing build failures.  (upstream dev-db/mysql can be highly sensitive to the specific
# version of Google Protocol Buffers (dev-libs/protobuf) installed
#
MYCMAKEARGS="-DWITH_PROTOBUF=bundled"

